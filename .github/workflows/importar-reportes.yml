# Botão "Run workflow": traz os formulários do Google para o site e abre um pull request. Não usa IA.
#   - doações (só data e valor, confirmados) -> dados/doacoes.json       (variável URL_DOACOES_CSV)
#   - erros reportados pelos estudantes  -> correções marcadas para refazer   (variável URL_REPORTES_CSV)
#   - revisões da liga                   -> selo "revisada" ou refazer         (variável URL_REVISOES_CSV)
#   - dúvidas respondidas pela liga      -> dados/duvidas.json                 (variável URL_DUVIDAS_CSV)
# Cada parte só roda se a variável existir. Depois de aprovar o PR, rode "Gerar correções" no modo pendentes
# para refazer as correções apontadas.
# Variáveis (uma vez): Settings > Secrets and variables > Actions > aba Variables > New repository variable,
#   com o link "Publicar na Web" (formato CSV) da planilha de respostas de cada formulário. Veja o LEIAME.
name: Importar formulários (reportes, revisões e dúvidas)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dados-crivo
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Importar
        env:
          URL_REPORTES: ${{ vars.URL_REPORTES_CSV }}
          URL_REVISOES: ${{ vars.URL_REVISOES_CSV }}
          URL_DUVIDAS: ${{ vars.URL_DUVIDAS_CSV }}
          URL_DOACOES: ${{ vars.URL_DOACOES_CSV }}
        run: |
          if [ -z "$URL_REPORTES$URL_REVISOES$URL_DUVIDAS$URL_DOACOES" ]; then
            echo "::error::Crie ao menos uma das variáveis URL_REPORTES_CSV, URL_REVISOES_CSV, URL_DUVIDAS_CSV ou URL_DOACOES_CSV (veja o LEIAME)."; exit 1
          fi
          : > relatorios_formularios.md
          if [ -n "$URL_REPORTES" ]; then
            python ferramentas/importar_reportes.py --csv "$URL_REPORTES" --dados dados --relatorio relatorios/reportes.md
            cat relatorios/reportes.md >> relatorios_formularios.md
          fi
          if [ -n "$URL_REVISOES" ]; then
            python ferramentas/importar_revisoes.py --csv "$URL_REVISOES" --dados dados --relatorio relatorios/revisoes.md
            cat relatorios/revisoes.md >> relatorios_formularios.md
          fi
          if [ -n "$URL_DUVIDAS" ]; then
            python ferramentas/importar_duvidas.py --csv "$URL_DUVIDAS" --dados dados --relatorio relatorios/duvidas.md
            cat relatorios/duvidas.md >> relatorios_formularios.md
          fi
          if [ -n "$URL_DOACOES" ]; then
            python ferramentas/importar_doacoes.py --csv "$URL_DOACOES" --dados dados --relatorio relatorios/doacoes.md
            cat relatorios/doacoes.md >> relatorios_formularios.md
          fi
          python ferramentas/gerar_indice.py --dados dados
          cat relatorios_formularios.md >> "$GITHUB_STEP_SUMMARY"
      - name: Abrir pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- dados)" ]; then echo "Nada novo nos formulários."; exit 0; fi
          ramo="formularios/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "crivo-bot"; git config user.email "crivo-bot@users.noreply.github.com"
          git checkout -b "$ramo"
          git add dados
          for f in relatorios/reportes.md relatorios/revisoes.md relatorios/duvidas.md relatorios/doacoes.md; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Formulários: reportes, revisões, dúvidas e doações"
          git push origin "$ramo"
          gh pr create --title "Formulários: reportes, revisões, dúvidas e doações" --body-file relatorios_formularios.md --base "${{ github.ref_name }}" --head "$ramo"
