# Botão "Run workflow" (aba Actions) que gera correções via API, abre um pull request e o aprova sozinho
# depois de validar os dados (as correções reprovadas pela revisão automática não entram).
# Pré-requisitos (uma vez):
#   1. Settings > Secrets and variables > Actions > New repository secret: DEEPSEEK_API_KEY
#   2. Settings > Actions > General > Workflow permissions: marcar
#      "Allow GitHub Actions to create and approve pull requests"
name: Gerar correções

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "gerar = escreve correções; catalogar = temas e disciplinas (uma vez); temas-padrao = lista de temas do site (todas as bancas; banca é ignorada); atualizar-referencias = refaz a 2.15 (sem custo); amostra = arquivo com as correções sorteadas para conferência"
        type: choice
        options: [gerar, catalogar, temas-padrao, atualizar-referencias, amostra]
        default: gerar
      banca:
        description: "Banca (ex.: AMP)"
        required: true
      ano:
        description: "Edições separadas por espaço (vazio = todas)"
        required: false
      questoes:
        description: "Questões (ex.: 50 ou 1-10,15). Vazio = usa o modo"
        required: false
      modo:
        description: "pendentes = sem correção/contradiz gabarito/reportadas; convertidas = também as antigas"
        type: choice
        options: [pendentes, convertidas, todas]
        default: pendentes
      limite:
        description: "Máximo de questões nesta execução"
        default: "20"
      orcamento:
        description: "Teto de custo em US$ desta execução"
        default: "1.00"
      conferidas:
        description: "Só para a ação amostra: ids já conferidos, separados por espaço (ex.: AMP-2020-Q3)"
        required: false
      simular:
        description: "Simular (não chama a API, não abre PR) — para testar"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write               # para disparar "Publicar site" depois de aprovar o PR sozinho

concurrency:
  group: dados-crivo            # nunca duas tarefas mexendo em dados/ ao mesmo tempo
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gerar correções
        id: gerar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BANCA: ${{ inputs.banca }}
          ANO: ${{ inputs.ano }}
          QUESTOES: ${{ inputs.questoes }}
          MODO: ${{ inputs.modo }}
          LIMITE: ${{ inputs.limite }}
          ORCAMENTO: ${{ inputs.orcamento }}
          SIMULAR: ${{ inputs.simular }}
          ACAO: ${{ inputs.acao }}
          CONFERIDAS: ${{ inputs.conferidas }}
        run: |
          if [ "$ACAO" = "atualizar-referencias" ]; then
            args=(atualizar-referencias --banca "$BANCA")
          elif [ "$ACAO" = "amostra" ]; then
            args=(amostra --banca "$BANCA")
            [ -n "$CONFERIDAS" ] && args+=(--conferidas $CONFERIDAS)
          elif [ "$ACAO" = "temas-padrao" ]; then
            args=(temas-padrao --orcamento "$ORCAMENTO")
          elif [ "$ACAO" = "catalogar" ]; then
            args=(catalogar --banca "$BANCA" --orcamento "$ORCAMENTO")
          else
            args=(gerar --banca "$BANCA" --modo "$MODO" --limite "$LIMITE" --orcamento "$ORCAMENTO")
            [ -n "$ANO" ] && args+=(--ano $ANO)
            [ -n "$QUESTOES" ] && args+=(--questoes "$QUESTOES")
          fi
          glob=()
          [ "$SIMULAR" = "true" ] && glob=(--simular)
          cp dados/gastos.json "$RUNNER_TEMP/gastos_antes.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/gastos_antes.json"
          touch "$RUNNER_TEMP/inicio"; sleep 1          # marca: só relatórios desta execução vão para o PR
          set +e
          python -u ferramentas/gerar_correcoes.py "${glob[@]}" "${args[@]}" 2>&1 | tee saida.txt
          codigo=${PIPESTATUS[0]}
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          python ferramentas/gerar_indice.py --dados dados
          {
            echo "## Resultado da geração (código $codigo)"
            case $codigo in
              0) echo "Concluído sem erros." ;;
              1) echo "**Nada foi feito:** veja a mensagem abaixo (ex.: teto acumulado do projeto atingido)." ;;
              2) echo "**Houve erro.** Leia as linhas com ERRO abaixo; as dicas dizem o que ajustar." ;;
              3) echo "Parou no teto de orçamento. Rode de novo para continuar de onde parou." ;;
            esac
            echo; echo '```'; grep -E "ERRO|Nada|PULADA|fila|histórico|verificação|referências|Disciplina|GRAVADA|amostra|Temas prontos|temas|Gasto acumulado|Teto|NÃO publicada|PARADO|custo estimado|Conexão|AVISO" saida.txt | tail -60; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # O gasto vai direto para o main (e não pelo PR): o teto acumulado conta o dinheiro mesmo se o PR
      # for fechado sem aprovar. Se o main não aceitar o push (ex.: branch protegida), o gasto segue no PR.
      - name: Registrar o gasto no main
        id: gasto
        if: ${{ always() && !inputs.simular }}
        run: |
          base="${{ github.ref_name }}"
          git config user.name "crivo-bot"; git config user.email "crivo-bot@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git fetch -q origin "$base"
            rm -rf "$RUNNER_TEMP/principal"; git worktree prune
            git worktree add -q --detach "$RUNNER_TEMP/principal" FETCH_HEAD
            n=$(python ferramentas/somar_gastos.py --antes "$RUNNER_TEMP/gastos_antes.json" --depois dados/gastos.json \
                  --destino "$RUNNER_TEMP/principal/dados/gastos.json")
            if [ "$n" = "0" ]; then echo "Nenhum gasto novo a registrar."; echo "no_main=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
            git -C "$RUNNER_TEMP/principal" add dados/gastos.json
            git -C "$RUNNER_TEMP/principal" commit -q -m "Gasto registrado: ${{ inputs.acao }} ${{ inputs.banca }} ${{ inputs.ano }} ${{ inputs.questoes }}"
            if git -C "$RUNNER_TEMP/principal" push -q origin "HEAD:$base"; then
              echo "Gasto registrado no $base."; echo "no_main=sim" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "::warning::Não foi possível gravar o gasto direto no $base; ele fica no pull request."
          echo "no_main=nao" >> "$GITHUB_OUTPUT"

      - name: Abrir pull request com o resultado
        if: ${{ !inputs.simular }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # o gasto já foi para o main: o PR não leva gastos.json (evita conflito entre PRs)
          [ "${{ steps.gasto.outputs.no_main }}" = "sim" ] && git checkout -- dados/gastos.json 2>/dev/null
          # status --porcelain também vê arquivos NOVOS (ex.: o catálogo de temas), não só os alterados
          if [ -z "$(git status --porcelain -- dados exams)" ]; then echo "Nada mudou em dados/."; exit 0; fi
          ramo="correcoes/${{ inputs.banca }}-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "crivo-bot"; git config user.email "crivo-bot@users.noreply.github.com"
          git checkout -b "$ramo"
          git add dados exams relatorios
          git commit -m "Correções geradas: ${{ inputs.banca }} ${{ inputs.ano }} ${{ inputs.questoes }}"
          aviso=""; [ "${{ steps.gerar.outputs.codigo }}" = "2" ] && aviso="[PARCIAL - houve erro] "
          git push origin "$ramo"
          rel=$(find relatorios -maxdepth 1 -name 'execucao_*.md' -newer "$RUNNER_TEMP/inicio" 2>/dev/null | sort | tail -1)
          { [ -n "$rel" ] && cat "$rel"; echo; echo "Saída da execução:"; echo '```'; tail -40 saida.txt; echo '```'
            echo "Este PR é aprovado sozinho depois da validação (as correções reprovadas já ficam fora do site)."; } > corpo.md
          url=$(gh pr create --title "${aviso}Correções: ${{ inputs.banca }} ${{ inputs.ano }} ${{ inputs.questoes }}" --body-file corpo.md --base "${{ github.ref_name }}" --head "$ramo")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: pr

      # Aprovação automática: confere os dados como o "Validar dados" faria (um PR aberto pelo robô não dispara
      # outros workflows), aprova o PR, apaga o ramo e publica o site. Se algo falhar, o PR fica aberto para você.
      - name: Validar e aprovar o pull request
        if: ${{ !inputs.simular && steps.pr.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python -m py_compile ferramentas/*.py
          python ferramentas/gerar_indice.py --dados dados > /dev/null
          [ -f gabarito.json ] && python ferramentas/conferir_gabarito.py --gabarito gabarito.json --dados dados
          if ! git diff --quiet -- dados exams; then
            echo "::warning::A validação alterou arquivos de dados; o PR fica aberto para conferência."; exit 0
          fi
          for tentativa in 1 2 3 4 5 6; do          # o GitHub leva alguns segundos para calcular se o PR pode ser aprovado
            sleep 5
            if gh pr merge "${{ steps.pr.outputs.url }}" --repo "$GITHUB_REPOSITORY" --merge --delete-branch; then
              echo "PR aprovado automaticamente."
              gh workflow run publicar-site.yml --ref "${{ github.ref_name }}" || echo "::warning::Rode Actions > Publicar site."
              exit 0
            fi
          done
          echo "::warning::Não foi possível aprovar o PR sozinho (ex.: branch protegida ou conflito); aprove-o à mão."

      - name: Falhar se houve erro
        if: ${{ steps.gerar.outputs.codigo == '2' }}
        run: |
          echo "::error::A geração teve erro. Abra o resumo desta execução (Summary) para ver a causa."
          grep -E "ERRO" saida.txt | head -5 | sed 's/^/::error::/'
          exit 1

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios
          path: relatorios/
          if-no-files-found: ignore
