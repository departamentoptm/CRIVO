# Publica o site no GitHub Pages só com os arquivos do site (sem ferramentas, relatórios, provas e arquivo/).
# Pré-requisito (uma vez): Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Montar a pasta do site
        run: |
          mkdir -p _site/exams
          cp index.html sobre.html privacidade.html previa.html .nojekyll _site/
          cp -r js dados _site/
          cp exams/disciplinas.json _site/exams/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
